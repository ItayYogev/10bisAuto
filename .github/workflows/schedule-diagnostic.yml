name: Schedule Diagnostic (No Payment)

on:
  schedule:
    - cron: "8,23,38,53 * * * *"

permissions: {}

jobs:
  report-time:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record automatic schedule delivery
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}
          RUN_ID: ${{ github.run_id }}
          RUN_COMMIT: ${{ github.sha }}
        run: |
          {
            echo "## Schedule diagnostic - no payment"
            echo "Event: $TRIGGER_EVENT"
            echo "Cron (UTC): $TRIGGER_SCHEDULE"
            echo "Runner time (UTC): $(date -u '+%Y-%m-%d %H:%M:%S %Z')"
            echo "Runner time (Israel): $(TZ=Asia/Jerusalem date '+%Y-%m-%d %H:%M:%S %Z')"
            echo "Run ID: $RUN_ID"
            echo "Commit: $RUN_COMMIT"
            echo "No checkout, credentials, token refresh or payment requests."
          } | tee -a "$GITHUB_STEP_SUMMARY"
